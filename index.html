//To-Do app
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Focus</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0f;
    --surface: #161618;
    --surface2: #1e1e21;
    --border: #2a2a2e;
    --accent: #f0c060;
    --accent2: #e07050;
    --text: #e8e6e0;
    --muted: #6a6860;
    --streak: #f0c060;
    --done: #4a9a6a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    padding: 0;
    overflow-x: hidden;
  }

  /* Grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 999;
    opacity: 0.4;
  }

  .app {
    max-width: 680px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 48px;
    animation: fadeUp 0.5s ease both;
  }

  .header-left h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.6rem;
    font-weight: 900;
    line-height: 1;
    color: var(--text);
    letter-spacing: -1px;
  }

  .header-left .date {
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 6px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* Streak badge */
  .streak-badge {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 20px;
    min-width: 90px;
    position: relative;
    overflow: hidden;
    cursor: default;
    transition: transform 0.2s;
  }

  .streak-badge::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(240,192,96,0.08) 0%, transparent 60%);
    pointer-events: none;
  }

  .streak-badge:hover { transform: scale(1.04); }

  .streak-flame {
    font-size: 1.6rem;
    line-height: 1;
    animation: flicker 2s ease-in-out infinite alternate;
  }

  .streak-num {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    font-weight: 900;
    color: var(--streak);
    line-height: 1.1;
  }

  .streak-label {
    font-size: 0.6rem;
    color: var(--muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  @keyframes flicker {
    0%   { transform: scaleY(1) rotate(-2deg); }
    50%  { transform: scaleY(1.08) rotate(1deg); }
    100% { transform: scaleY(0.96) rotate(-1deg); }
  }

  /* Divider */
  .divider {
    height: 1px;
    background: var(--border);
    margin: 0 0 32px;
    animation: fadeUp 0.5s 0.1s ease both;
  }

  /* Main goal section */
  .section-label {
    font-size: 0.62rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .main-goal-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px;
    margin-bottom: 32px;
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.5s 0.15s ease both;
    transition: border-color 0.2s;
  }

  .main-goal-card::after {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: linear-gradient(to bottom, var(--accent), var(--accent2));
    border-radius: 4px 0 0 4px;
  }

  .main-goal-card.completed {
    border-color: var(--done);
    opacity: 0.75;
  }

  .main-goal-card.completed::after {
    background: var(--done);
  }

  .goal-row {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .check-btn {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    background: transparent;
    cursor: pointer;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, border-color 0.2s, transform 0.15s;
    color: transparent;
    font-size: 0.9rem;
  }

  .check-btn:hover { transform: scale(1.1); }

  .check-btn.checked {
    background: var(--done);
    border-color: var(--done);
    color: white;
  }

  .check-btn.main { width: 34px; height: 34px; border-color: var(--accent); font-size: 1rem; }
  .check-btn.main.checked { background: var(--done); border-color: var(--done); }

  .goal-text {
    flex: 1;
    font-size: 1rem;
    font-weight: 500;
    color: var(--text);
    transition: color 0.2s;
    cursor: pointer;
    background: transparent;
    border: none;
    outline: none;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0;
    line-height: 1.5;
    resize: none;
    overflow: hidden;
    min-height: 28px;
    padding: 0;
  }

  .goal-text.main-text { font-size: 1.15rem; font-weight: 500; }
  .goal-text.done-text { text-decoration: line-through; color: var(--muted); }

  .goal-text::placeholder { color: var(--muted); }

  /* Other goals list */
  .goals-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    animation: fadeUp 0.5s 0.2s ease both;
  }

  .goal-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: border-color 0.2s, opacity 0.2s;
    position: relative;
  }

  .goal-item.completed { opacity: 0.55; }

  .goal-item:hover { border-color: #3a3a40; }

  .delete-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.85rem;
    padding: 4px;
    border-radius: 6px;
    opacity: 0;
    transition: opacity 0.15s, color 0.15s;
    flex-shrink: 0;
  }

  .goal-item:hover .delete-btn { opacity: 1; }
  .delete-btn:hover { color: var(--accent2); }

  /* Add goal input */
  .add-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 10px;
    padding: 12px 18px;
    border: 1px dashed var(--border);
    border-radius: 14px;
    transition: border-color 0.2s;
    animation: fadeUp 0.5s 0.25s ease both;
  }

  .add-row:focus-within { border-color: var(--accent); }

  .add-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.88rem;
  }

  .add-input::placeholder { color: var(--muted); }

  .add-btn {
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: #0e0e0f;
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    font-weight: 500;
    padding: 5px 12px;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    letter-spacing: 1px;
  }

  .add-btn:hover { opacity: 0.85; transform: scale(0.97); }

  /* Progress bar */
  .progress-section {
    margin-top: 40px;
    animation: fadeUp 0.5s 0.3s ease both;
  }

  .progress-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .progress-pct {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    color: var(--accent);
  }

  .progress-track {
    height: 6px;
    background: var(--surface2);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(to right, var(--accent), var(--accent2));
    border-radius: 99px;
    transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* Streak calendar dots */
  .streak-dots {
    display: flex;
    gap: 5px;
    margin-top: 8px;
  }

  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--surface2);
    border: 1px solid var(--border);
    transition: background 0.3s;
  }

  .dot.active { background: var(--accent); border-color: var(--accent); }
  .dot.today { background: var(--accent2); border-color: var(--accent2); box-shadow: 0 0 6px rgba(224,112,80,0.6); }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    padding: 10px 20px;
    border-radius: 99px;
    z-index: 100;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
  }

  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Confetti burst */
  .burst {
    position: fixed;
    pointer-events: none;
    z-index: 998;
  }

  .particle {
    position: absolute;
    width: 7px; height: 7px;
    border-radius: 2px;
    animation: burst-out 0.7s ease forwards;
  }

  @keyframes burst-out {
    0%   { transform: translate(0,0) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) rotate(360deg); opacity: 0; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <h1>Daily Focus</h1>
      <div class="date" id="dateLabel"></div>
    </div>
    <div class="streak-badge" title="Your current streak">
      <div class="streak-flame">🔥</div>
      <div class="streak-num" id="streakNum">0</div>
      <div class="streak-label">day streak</div>
    </div>
  </div>

  <!-- Streak dots -->
  <div class="divider"></div>
  <div class="section-label">Last 7 days</div>
  <div class="streak-dots" id="streakDots"></div>

  <!-- Progress -->
  <div class="progress-section">
    <div class="progress-header">
      <span class="section-label" style="margin:0">Today's progress</span>
      <span class="progress-pct" id="progressPct">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
  </div>

  <!-- Main Goal -->
  <div style="margin-top:36px">
    <div class="section-label">★ Main goal</div>
    <div class="main-goal-card" id="mainGoalCard">
      <div class="goal-row">
        <button class="check-btn main" id="mainCheckBtn" onclick="toggleMain()" title="Mark complete">✓</button>
        <textarea class="goal-text main-text" id="mainGoalInput" rows="1"
          placeholder="Set your #1 priority for today…"
          oninput="autoResize(this); saveData()"
          onblur="saveData()"></textarea>
      </div>
    </div>

    <!-- Other goals -->
    <div class="section-label">Other goals</div>
    <div class="goals-list" id="goalsList"></div>

    <!-- Add -->
    <div class="add-row">
      <span style="color:var(--muted);font-size:1rem">+</span>
      <input class="add-input" id="addInput" placeholder="Add a goal… (Enter)"
        onkeydown="if(event.key==='Enter') addGoal()" />
      <button class="add-btn" onclick="addGoal()">ADD</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const KEY = 'dailyfocus_v2';

function getToday() {
  return new Date().toISOString().slice(0,10);
}

function loadData() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; }
}

function saveToStorage(data) {
  localStorage.setItem(KEY, JSON.stringify(data));
}

let data = loadData();
const today = getToday();

// Init today's entry
if (!data[today]) {
  data[today] = { mainGoal: '', mainDone: false, goals: [] };
}

// Date label
const d = new Date();
document.getElementById('dateLabel').textContent =
  d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' }).toUpperCase();

// ---- Streak logic ----
function computeStreak() {
  let streak = 0;
  let cursor = new Date();
  for (let i = 0; i < 365; i++) {
    const k = cursor.toISOString().slice(0,10);
    const entry = data[k];
    const completed = entry && (entry.mainDone || (entry.goals && entry.goals.some(g=>g.done)));
    if (completed) { streak++; cursor.setDate(cursor.getDate()-1); }
    else if (i === 0) { cursor.setDate(cursor.getDate()-1); } // today not done yet, check yesterday
    else break;
  }
  return streak;
}

function renderStreakDots() {
  const container = document.getElementById('streakDots');
  container.innerHTML = '';
  for (let i = 6; i >= 0; i--) {
    const d2 = new Date(); d2.setDate(d2.getDate()-i);
    const k = d2.toISOString().slice(0,10);
    const entry = data[k];
    const completed = entry && (entry.mainDone || (entry.goals && entry.goals.some(g=>g.done)));
    const dot = document.createElement('div');
    dot.className = 'dot' + (i===0 ? ' today' : (completed ? ' active' : ''));
    dot.title = k;
    container.appendChild(dot);
  }
  document.getElementById('streakNum').textContent = computeStreak();
}

// ---- Progress ----
function updateProgress() {
  const entry = data[today];
  let total = 1 + entry.goals.length;
  let done = (entry.mainDone ? 1 : 0) + entry.goals.filter(g=>g.done).length;
  const pct = total === 0 ? 0 : Math.round((done/total)*100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressPct').textContent = pct + '%';
  renderStreakDots();
}

// ---- Main goal ----
function renderMain() {
  const entry = data[today];
  const input = document.getElementById('mainGoalInput');
  const btn = document.getElementById('mainCheckBtn');
  const card = document.getElementById('mainGoalCard');
  input.value = entry.mainGoal || '';
  autoResize(input);
  if (entry.mainDone) {
    btn.classList.add('checked'); btn.textContent = '✓';
    card.classList.add('completed');
    input.classList.add('done-text');
  } else {
    btn.classList.remove('checked'); btn.textContent = '✓';
    card.classList.remove('completed');
    input.classList.remove('done-text');
  }
}

function toggleMain() {
  data[today].mainDone = !data[today].mainDone;
  saveData();
  renderMain();
  updateProgress();
  if (data[today].mainDone) {
    showToast('🎯 Main goal crushed!');
    burst(document.getElementById('mainGoalCard'));
  }
}

// ---- Other goals ----
function renderGoals() {
  const list = document.getElementById('goalsList');
  const goals = data[today].goals || [];
  list.innerHTML = '';
  goals.forEach((g, i) => {
    const item = document.createElement('div');
    item.className = 'goal-item' + (g.done ? ' completed' : '');
    item.innerHTML = `
      <button class="check-btn ${g.done?'checked':''}" onclick="toggleGoal(${i})" title="Toggle">✓</button>
      <input class="goal-text ${g.done?'done-text':''}" value="${escHtml(g.text)}"
        onchange="editGoal(${i}, this.value)"
        placeholder="Goal…" />
      <button class="delete-btn" onclick="deleteGoal(${i})" title="Delete">✕</button>
    `;
    list.appendChild(item);
  });
}

function toggleGoal(i) {
  data[today].goals[i].done = !data[today].goals[i].done;
  saveData();
  renderGoals();
  updateProgress();
  if (data[today].goals[i].done) {
    showToast('✅ Goal done!');
    const items = document.querySelectorAll('.goal-item');
    if (items[i]) burst(items[i]);
  }
}

function editGoal(i, val) {
  data[today].goals[i].text = val;
  saveData();
}

function deleteGoal(i) {
  data[today].goals.splice(i, 1);
  saveData();
  renderGoals();
  updateProgress();
}

function addGoal() {
  const input = document.getElementById('addInput');
  const text = input.value.trim();
  if (!text) return;
  data[today].goals.push({ text, done: false });
  input.value = '';
  saveData();
  renderGoals();
  updateProgress();
}

// ---- Save ----
function saveData() {
  data[today].mainGoal = document.getElementById('mainGoalInput').value;
  saveToStorage(data);
  updateProgress();
}

// ---- Utils ----
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function burst(el) {
  const rect = el.getBoundingClientRect();
  const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
  const colors = ['#f0c060','#e07050','#6ab870','#60a0e0','#e060a0'];
  const container = document.createElement('div');
  container.className = 'burst';
  container.style.cssText = `left:${cx}px;top:${cy}px`;
  for (let i = 0; i < 14; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const angle = (i/14)*360;
    const dist = 40 + Math.random()*50;
    const tx = Math.cos(angle*Math.PI/180)*dist;
    const ty = Math.sin(angle*Math.PI/180)*dist - 20;
    p.style.cssText = `background:${colors[i%colors.length]};--tx:${tx}px;--ty:${ty}px;left:-3px;top:-3px;animation-delay:${Math.random()*0.1}s`;
    container.appendChild(p);
  }
  document.body.appendChild(container);
  setTimeout(() => container.remove(), 800);
}

// ---- Init ----
renderMain();
renderGoals();
updateProgress();
</script>
</body>
</html>
